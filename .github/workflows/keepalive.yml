name: Render Keepalive

on:
  schedule:
    # Runs every 10 minutes to prevent Render Free tier from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          curl -s -L -o /dev/null -w "%{http_code}" https://gameworld-bot-tx7b.onrender.com/
